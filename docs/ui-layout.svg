        </g>
        <g font-size="11" fill="#5c5044">
          <g transform="translate(0,304)"><circle cx="102" cy="0" r="3.5" fill="none" stroke="#c96442" stroke-width="1.1"/><text x="114" y="3.5">本地已经安装了这…</text><text x="300" y="3.5" font-size="9.5" fill="#847a6d" text-anchor="end">08/03 22:59</text></g>
          <g transform="translate(0,326)"><circle cx="102" cy="0" r="3.5" fill="none" stroke="#c96442" stroke-width="1.1"/><text x="114" y="3.5">https://github.co…</text><text x="300" y="3.5" font-size="9.5" fill="#847a6d" text-anchor="end">08/03 22:57</text></g>
          <g transform="translate(0,348)"><circle cx="102" cy="0" r="3.5" fill="none" stroke="#c96442" stroke-width="1.1"/><text x="114" y="3.5">当前项目的远程是…</text><text x="300" y="3.5" font-size="9.5" fill="#847a6d" text-anchor="end">08/03 22:56</text></g>
          <g transform="translate(0,370)"><circle cx="102" cy="0" r="3.5" fill="none" stroke="#c96442" stroke-width="1.1"/><text x="114" y="3.5">d92690dd-4bde-4…</text><text x="300" y="3.5" font-size="9.5" fill="#847a6d" text-anchor="end">08/02 19:55</text></g>
