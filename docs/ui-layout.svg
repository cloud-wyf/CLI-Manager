<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1030" width="1800" height="1030" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>CLI-Manager 界面结构图（Claude Light 主题）</title>

  <defs>
